<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Portfolio with Accessible Images – HTML &amp; CSS course assignment">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio with Accessible Images</title>
</head>
<body>
  <header><h1>FAZILAT KHAN – Portfolio</h1></header>
  <main>
    <section>
      <h2>Profile</h2>
      <!-- Meaningful alt: describes content AND purpose -->
      <img src="screenshots/my-image.png" width="300" height="300"
           alt="Portrait of Fazilat, a smiling young woman with dark brown hair">
    </section>

    <section>
      <h2>Projects</h2>
      <figure>
        <img src="screenshots/resume-img.png" width="400" height="400"
             alt="Screenshot of the resume website showing a name header and skills list">
        <figcaption>Resume website</figcaption>
      </figure>
      <figure>
        <img src="screenshots/regristration-form.png" width="700" height="400"
             alt="Screenshot of the student registration form with name, email and course fields">
        <figcaption>Registration form</figcaption>
      </figure>
    </section>

    <section>
      <h2>Decorative image</h2>
      <!-- Purely decorative images get an EMPTY alt so screen readers skip them -->
      <img src="screenshots/van gogh.png" width="500" height="400" alt="">
    </section>

    <section>
      <h2>Linked image</h2>
      <a href="https://github.com/fazilatkhan7"><img src="screenshots/github-profile.png" width="400" height="300" alt="Visit my GitHub profile"></a>
    </section>
  </main>
</body>
</html>
