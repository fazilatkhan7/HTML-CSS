
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Navbar and Hero</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #1d1d1f;
            background: white;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 7%;
            background: white;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .links a {
            text-decoration: none;
            color: #1d1d1f;
            font-size: 14px;
        }

        .links a:hover {
            color: #0071e3;
        }

        #toggle,
        .burger {
            display: none;
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            padding: 45px 3% 20px;
            background: #f5f5f7;
            overflow: hidden;
        }

        .hero__text {
            width: 100%;
            margin-bottom: 25px;
        }

        .hero__text h1 {
            font-size: clamp(40px, 5vw, 64px);
            margin-bottom: 12px;
        }

        .hero__text p {
            font-size: clamp(17px, 2vw, 22px);
            color: #515154;
            margin-bottom: 22px;
        }

        .hero__btns {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 11px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 15px;
        }

        .btn--primary {
            background: #0071e3;
            color: white;
        }

        .btn--ghost {
            border: 1px solid #0071e3;
            color: #0071e3;
        }

        /* Large Product Image */
        .hero__img {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .hero__img img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: contain;
            object-position: center;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .navbar {
                padding: 16px 20px;
            }

            .burger {
                display: block;
                font-size: 27px;
                cursor: pointer;
            }

            .links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                z-index: 10;
                flex-direction: column;
                gap: 22px;
                background: white;
                padding: 25px;
                box-shadow: 0 5px 10px #00000012;
            }

            #toggle:checked ~ .links {
                display: flex;
            }

            .hero {
                padding: 40px 15px 20px;
            }

            .hero__text h1 {
                font-size: 42px;
            }

            .hero__text p {
                font-size: 17px;
                line-height: 1.5;
            }

            .hero__img img {
                max-height: 320px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <span class="logo">Apple</span>

        <input type="checkbox" id="toggle">

        <label for="toggle" class="burger"
               aria-label="Toggle navigation">
            ☰
        </label>

        <ul class="links">
            <li><a href="https://www.apple.com/in/store/">Store</a></li>
            <li><a href="https://www.apple.com/in/mac/">Mac</a></li>
            <li><a href="https://www.apple.com/in/ipad/">iPad</a></li>
            <li><a href="https://www.apple.com/in/iphone/">iPhone</a></li>
        </ul>
    </nav>

    <main class="hero">

        <div class="hero__text">
            <h1>iPhone</h1>

            <p>Designed to delight.</p>

            <div class="hero__btns">
                <a class="btn btn--primary"
                   href="https://www.apple.com/in/iphone/">
                    Learn more
                </a>

                <a class="btn btn--ghost"
                   href="https://www.apple.com/in/shop/buy-iphone">
                    Buy
                </a>
            </div>
        </div>

        <div class="hero__img">
            <img
                src="https://www.apple.com/v/iphone/home/cj/images/meta/iphone__bh930eyjnj0i_og.png?202606161406"
                alt="Apple iPhone product showcase"
                onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=1400&q=85';"
            >
        </div>

    </main>

</body>
</html>
